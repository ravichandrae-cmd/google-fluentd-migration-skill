  @type record_transformer
  <record>
    database "mongodb-prod"
    environment "production"
  </record>
</filter>

# Google Cloud Output Plugin
<match mongodb.server>
  @type google_cloud
  # NOTE: 'auto_typecast' directive stripped (unsupported in upstream parser)
  use_grpc true
</match>
