# MongoDB Log Source
<source>
  @type tail
  path /var/log/mongodb/mongod.log
  pos_file /var/log/fluentd/mongodb.pos
  tag mongodb.server
  <parse>
    @type json
    # NOTE: 'auto_typecast' directive stripped (unsupported in upstream parser)
  </parse>
</source>

# Dynamic Customer Metadata Labels
