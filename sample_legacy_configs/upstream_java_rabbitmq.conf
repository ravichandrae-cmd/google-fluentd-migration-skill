# WARNING [MIGRATION EDGE CASE]:
# The following legacy parameters could not be automatically mapped to upstream format:
# - Parameter: 'custom_legacy_routing_key' in <match **>
# Action Required: Verify if custom routing metadata needs to be passed via record_transformer filter labels instead.

# Upstream Migrated Configuration

# Java Application HTTP Ingestion Receiver
<source>
  @type http
  port 8080
  bind 0.0.0.0
  body_size_limit 64m
  keep_alive_timeout 15s
  tag java.http.app
  <parse>
    @type json
    # NOTE: 'auto_typecast' removed (unsupported in upstream parser)
  </parse>
</source>

# RabbitMQ Server Log Source (Updated Multiline Regex Format)
<source>
  @type tail
  path /var/log/rabbitmq/rabbit@localhost.log
  pos_file /var/log/fluentd/rabbitmq.pos
  tag rabbitmq.server
  <parse>
    @type multiline
    format_firstline /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/
    format1 /(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] <(?<pid>\d+\.\d+\.\d+)> (?<message>.*)/
  </parse>
</source>

# Java Multi-line Stack Trace Exception Detection
<filter java.http.app>
  @type detect_exceptions
  message message
  languages ["java"]
</filter>

# Google Cloud Output Plugin with gRPC Compression
<match **>
  @type google_cloud
  # NOTE: 'auto_typecast' removed (unsupported in upstream parser)
  use_grpc true
  grpc_compression_algorithm gzip
</match>
