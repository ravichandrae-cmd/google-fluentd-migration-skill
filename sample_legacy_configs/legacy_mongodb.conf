# Legacy MongoDB Logging Configuration
<source>
  @type tail
  path /var/log/mongodb/mongod.log
  pos_file /var/log/fluentd/mongodb.pos
  tag mongodb.server
  <parse>
    @type json
    auto_typecast true
  </parse>
</source>

<filter mongodb.server>
  @type record_transformer
  <record>
    database "mongodb-prod"
    environment "production"
  </record>
</filter>

<match mongodb.server>
  @type google_cloud
  auto_typecast true
  custom_mongodb_buffer_tuning true
</match>
