# Upstream Migrated System Log Stream Configuration
# Generated automatically by upstream-config-migrator Agent Skill

# System Syslog Receiver Source
<source>
  @type syslog
  port 5140 # NOTE: Changed from port 514 to unprivileged port 5140 for unprivileged agent execution
  bind 0.0.0.0
  tag syslog.system
</source>

# Active File Tailing Source for System Messages
<source>
  @type tail
  path /var/log/syslog
  pos_file /var/log/fluentd/syslog.pos
  tag syslog.tail
  <parse>
    @type syslog
  </parse>
</source>

# Google Cloud Output Plugin
<match syslog.**>
  @type google_cloud
  use_grpc true
  grpc_compression_algorithm gzip
</match>
