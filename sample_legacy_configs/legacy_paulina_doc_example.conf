<source>
    @type tail
    path /var/log/my-app.log
    format json
    auto_typecast true
</source>

<filter foo.bar>
  @type record_transformer
  enable_ruby true
  <record>
    raw_timestamp ${time}
  </record>
</filter>

<match **>
  @type google_cloud
  buffer_type file
  buffer_path /var/log/google-fluentd/buffers
  buffer_chunk_limit 512KB
  flush_interval 5s
  disable_retry_limit false
  retry_limit 3
  retry_wait 10
  max_retry_wait 300
  num_threads 8
  partial_success true
</match>
