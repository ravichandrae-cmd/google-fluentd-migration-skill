# Legacy Memcached Logging Configuration
<source>
  @type tail
  path /var/log/memcached.log
  pos_file /var/log/fluentd/memcached.pos
  tag memcached.cache
  <parse>
    @type syslog
    auto_typecast true
  </parse>
</source>

<filter memcached.cache>
  @type record_transformer
  <record>
    service "memcached-cache"
    environment "production"
  </record>
</filter>

<match memcached.cache>
  @type google_cloud
  auto_typecast true
  custom_memcached_buffer_opt true
</match>
