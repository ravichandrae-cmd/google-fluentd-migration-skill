# WARNING [MIGRATION EDGE CASE]:
# The following legacy parameters could not be automatically mapped to upstream format:
# - Parameter: 'custom_legacy_buffer_option' in <match **>
# Action Required: Review upstream documentation for equivalent buffer tuning options.

# Upstream Migrated Configuration

# Nginx Access Log Source
<source>
  @type tail
  path /var/log/nginx/access.log
  pos_file /var/log/fluentd/nginx-access.log.pos
  tag nginx.access
  <parse>
    @type json
    # NOTE: 'auto_typecast' removed (unsupported in upstream parser)
  </parse>
</source>

# Syslog Receiver Source
<source>
  @type syslog
  port 5140 # NOTE: Changed from port 514 to unprivileged port 5140 for unprivileged agent execution
  bind 0.0.0.0
  tag syslog.system
</source>

# Label / Metadata Record Transformer Filter
<filter nginx.access>
  @type record_transformer
  <record>
    environment "production"
    cluster "us-central1-a"
  </record>
</filter>

# Google Cloud Output Plugin
<match **>
  @type google_cloud
  # NOTE: 'auto_typecast' removed (unsupported in upstream parser)
  use_grpc true
</match>
