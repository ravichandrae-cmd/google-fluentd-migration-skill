# Legacy Salt Minion Log Configuration
<source>
  @type tail
  path /var/log/salt/minion
  pos_file /var/log/fluentd/salt_minion.pos
  tag salt.minion
  format multiline
  format_firstline /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}/
  format1 /^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \[(?<logger>[^\]]+)\]\[(?<level>[A-Z]+)\]\[(?<pid>\d+)\] (?<message>.*)$/
  time_format %Y-%m-%d %H:%M:%S,%f
</source>

<filter salt.minion>
  @type record_transformer
  enable_ruby true
  <record>
    app "saltstack"
    legacy_timestamp ${time}
  </record>
</filter>

<match salt.minion>
  @type google_cloud
  buffer_type file
  buffer_path /var/log/google-fluentd/buffers/salt
  buffer_chunk_limit 2M
  flush_interval 5s
  salt_master_ip 10.0.0.1
</match>
